<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A directed acyclic graph showing the five core information-flow edges of the capstone causal architecture: SENTIMENT flowing into MOMENTUM, MOMENTUM and VALUE both flowing into RETURNS, VOLATILITY flowing into RISK, and RISK flowing into ALLOCATION, drawn with seven nodes arranged left to right in three columns and five directed arrows labeled with the edge index from the CAUSAL_EDGES dictionary in NB04.</desc>
