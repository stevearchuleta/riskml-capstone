<svg width="100%" viewBox="0 0 680 601.54" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Test 5 dtype-aware boolean coercion and count pipeline</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Vertical pipeline showing the defensive pandas data handling in test 5: starting with the allowed_for_risk Series read from the CSV with potentially either bool or object dtype, then branching on the dtype check with the object case applying a three-step astype-strip-equality coercion and the bool case passing through, merging back into a unified boolean Series of 151 values, then summing to get 74, casting to a Python int, and finally asserting equality with 74 which passes green.</desc>
