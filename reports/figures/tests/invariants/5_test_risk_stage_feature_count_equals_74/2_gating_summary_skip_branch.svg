<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Flowchart showing the two-path branching at the start of test 5 based on whether the gating summary CSV exists on disk: if the file is present the test continues to validate schema and count, ending with a green pass; if the file is missing the test calls pytest.skip with a diagnostic message resulting in a yellow SKIPPED status that does not turn CI red, which is the appropriate behavior on a fresh clone where NB04 has not yet been executed.</desc>
