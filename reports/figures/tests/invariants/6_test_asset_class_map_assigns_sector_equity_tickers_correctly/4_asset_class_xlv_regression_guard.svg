<svg width="100%" viewBox="0 0 680 560" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">How Test 6 acts as a regression guard if XLV is ever unmapped in a future PR</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Counterfactual scenario diagram showing what happens if a future pull request accidentally removes XLV from ASSET_CLASS_MAP: the loop iterates through XLF XLK and XLE successfully but fails on the fourth iteration when XLV is not found in source, raising an AssertionError that propagates through pytest to turn CI workflow red and block the pull request from merging into main; the bottom of the diagram explains the institutional memory concept and why regression-guard tests are different from architectural tests.</desc>
