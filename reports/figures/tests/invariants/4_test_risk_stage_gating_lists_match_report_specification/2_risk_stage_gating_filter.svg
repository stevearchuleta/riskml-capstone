<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Visualization of the prefix-based gating that operates at the RISK model input: three allowed feature prefixes (VOL, MACRO, REGIME) flow with arrows into a central RISK model node on the right side of the diagram, while four explicitly forbidden prefixes (MOM, VAL, ML, SENT) sit below them and are each blocked by a red barrier with a cross mark indicating they cannot reach RISK.</desc>
